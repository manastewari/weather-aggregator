[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-aggregator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "requests>=2.32,<3", "sqlalchemy>=2.0,<3", "psycopg2-binary>=2.9,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "responses>=0.25,<1", "testcontainers[postgres]>=4.15,<5", "pact-python>=3,<4", "behave>=1.3,<2"]

[tool.setuptools.packages.find]
include = ["weather*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: isolated domain and service", "adapter: external adapter", "contract: Pact consumer and provider", "integration: real PostgreSQL container", "component: full HTTP application", "bdd: Behave scenarios", "ui: React tests and production build"]
